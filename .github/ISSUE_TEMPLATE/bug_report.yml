name: 오류 신고
description: 재현 가능한 궤도 실험·화면·저장 문제를 알려 주세요.
title: "[오류] "
body:
  - type: markdown
    attributes:
      value: |
        실험 원문을 먼저 보관하세요. 개인 경로, 계정 정보, 토큰이나 전체 사용자 프로필을 올리지 마세요.
        Orbit Lab은 고정 태양과 입자 하나의 이상적인 결합 궤도를 다루며 실제 날짜의 천체 위치나 비행 임무를 예측하지 않습니다.
  - type: input
    id: version
    attributes:
      label: Orbit Lab 버전
      description: 프로그램 정보 또는 설치 파일 이름의 버전입니다.
      placeholder: "1.0.0"
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 실행 환경
      description: Windows 버전, GPU, 화면 배율·해상도, 설치 앱 또는 개발 브라우저 여부를 적어 주세요. 개인 경로는 필요 없습니다.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 궤도 조건과 재현 순서
      description: 긴반지름 a(AU), 이심률 e, 진행률 t/T, 시간 속도와 누른 버튼 순서를 적어 주세요. 현재 또는 보관한 비교 중 무엇인지도 알려 주세요.
    validations:
      required: true
  - type: textarea
    id: expected_actual
    attributes:
      label: 기대한 결과와 실제 결과
      description: 오류 문구, 거리·속력·주기의 단위, 그래프·3D 중 어긋난 부분을 포함하면 도움이 됩니다.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 선택 자료
      description: 개인 정보를 지운 작은 실험 JSON이나 스크린샷을 첨부할 수 있습니다. 비교 이름을 확인하고 손상 원본을 덮어쓰지 마세요.
