name: 관찰·실험 개선 제안
description: 궤도 관찰이나 비교 실험에서 막힌 점을 알려 주세요.
title: "[제안] "
body:
  - type: textarea
    id: problem
    attributes:
      label: 무엇을 관찰하려 했나요?
      description: 궤도의 크기·모양·속력·주기·면적 중 이해하기 어렵거나 조작하기 불편했던 부분을 적어 주세요.
    validations:
      required: true
  - type: textarea
    id: change
    attributes:
      label: 어떤 변화가 도움이 되나요?
      description: 예상하는 동작이나 비교 방법을 적어 주세요. 사용 권한이 없는 외부 이미지나 교재 도판은 첨부하지 마세요.
    validations:
      required: true
